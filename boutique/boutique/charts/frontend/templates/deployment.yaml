---
# Source: boutique/charts/frontend/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boutique-frontend
  labels:
    helm.sh/chart: frontend-0.1.0
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: boutique
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/instance: boutique
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/instance: boutique
    spec:
      serviceAccountName: boutique-frontend
      securityContext:
        {}
      containers:
        - name: frontend
          envFrom:
            - configMapRef:
                name: boutique-frontend
          securityContext:
            {}
          image: "368763425814.dkr.ecr.us-east-1.amazonaws.com/prod/frontend:863b6fe7d3a4d4bebafbb7ba9943b2ef77864ee3"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 360
          readinessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 360
          resources:
            {}

