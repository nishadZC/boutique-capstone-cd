---
# Source: boutique/charts/gateway/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boutique-gateway
  labels:
    helm.sh/chart: gateway-0.1.0
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: boutique
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/instance: boutique
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/instance: boutique
    spec:
      serviceAccountName: boutique-gateway
      securityContext:
        {}
      containers:
        - name: gateway
          envFrom:
            - configMapRef:
                name: boutique-gateway
          securityContext:
            {}
          image: "368763425814.dkr.ecr.us-east-1.amazonaws.com/prod/gateway:6eae8900eb8c072f1e0072313f99a802f0cf9f59"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/metrics
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /api/metrics
              port: http
          resources:
            {}

